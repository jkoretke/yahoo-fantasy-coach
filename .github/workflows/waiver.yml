name: waiver
# Scheduled lane: emails the waiver routine on a cron. Never runs from a pull
# request, so a fork can never reach these secrets. GitHub Actions cron is UTC
# only and can run late, sometimes 15 minutes or more.
#
# A failed run now fails the job: the wrapper exits 1 on any "failed" STATUS line, so
# a red job means no email was sent. Read the STATUS line at the end of the job log
# for which failure it was. "STATUS emailed waiver" is the success. "STATUS failed
# waiver engine-error" is usually a week that could not be resolved from ESPN (pass
# the workflow_dispatch week input to override it), and "STATUS failed waiver
# email-send-failed" means the email backend could not send (for the smtp backend,
# usually a missing CURLRC secret). A green job with "STATUS skipped ..." is a real
# skip, not a failure. Yahoo Fantasy Sports API access is still pending approval.
#
# Required repository secrets: YAHOO_CLIENT_ID, YAHOO_CLIENT_SECRET,
# YAHOO_REFRESH_TOKEN, LEAGUE_YAML (the whole contents of your config/league.yaml).
# Optional: BREVO_API_KEY (only for the brevo email backend), CURLRC (only for the
# smtp email backend, the whole contents of your curl config file).
on:
  schedule:
    - cron: "0 3 * * 3"   # Tuesday 20:00 America/Los_Angeles is Wednesday 03:00 UTC, before waivers process
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week number to run. Required for a live run today."
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: waiver
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write the league config and credentials
        env:
          LEAGUE_YAML: ${{ secrets.LEAGUE_YAML }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CURLRC: ${{ secrets.CURLRC }}
        run: |
          mkdir -p "$HOME/.config/yahoo-fantasy-coach"
          chmod 700 "$HOME/.config/yahoo-fantasy-coach"
          printf '%s\n' "$LEAGUE_YAML" > config/league.yaml
          {
            printf 'YAHOO_CLIENT_ID=%s\n' "$YAHOO_CLIENT_ID"
            printf 'YAHOO_CLIENT_SECRET=%s\n' "$YAHOO_CLIENT_SECRET"
            printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY"
          } > "$HOME/.config/yahoo-fantasy-coach/secrets.env"
          chmod 600 "$HOME/.config/yahoo-fantasy-coach/secrets.env"
          {
            printf 'YAHOO_CONSUMER_KEY=%s\n' "$YAHOO_CLIENT_ID"
            printf 'YAHOO_CONSUMER_SECRET=%s\n' "$YAHOO_CLIENT_SECRET"
            printf 'YAHOO_REFRESH_TOKEN=%s\n' "$YAHOO_REFRESH_TOKEN"
          } > "$HOME/.config/yahoo-fantasy-coach/.env"
          chmod 600 "$HOME/.config/yahoo-fantasy-coach/.env"
          # Only for the smtp email backend. An EMPTY curlrc is worse than none at
          # all: engine.notify gates on the file existing, so write it only when the
          # secret is actually set.
          if [ -n "$CURLRC" ]; then
            printf '%s\n' "$CURLRC" > "$HOME/.config/yahoo-fantasy-coach/curlrc"
            chmod 600 "$HOME/.config/yahoo-fantasy-coach/curlrc"
          fi
      - name: Run the waiver routine
        env:
          WEEK: ${{ github.event.inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then
            python -m engine.waiver_run --prose plain --week "$WEEK"
          else
            python -m engine.waiver_run --prose plain
          fi
